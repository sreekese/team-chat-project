services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: team-chat-app
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - postgres
    networks:
      - team-chat

  nginx:
    image: nginx:alpine
    container_name: team-chat-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.config:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - team-chat

  postgres:
    image: postgres:16
    container_name: team-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: team_chat
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: laravel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d team_chat"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - team-chat

  pgadmin:
    image: dpage/pgadmin4
    container_name: team-chat-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@team-chat.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - team-chat

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: team-chat-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8080:8080"
    depends_on:
      - app
    networks:
      - team-chat

networks:
  team-chat:
    driver: bridge

volumes:
  postgres-data: