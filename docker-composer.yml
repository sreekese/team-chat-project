services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: team-chat-app
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    networks:
      - team-chat

  nginx:
    image: nginx:alpine
    container_name: team-chat-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - team-chat

  mysql:
    image: mysql:8.0
    container_name: team-chat-mysql
    environment:
      MYSQL_DATABASE: team_chat
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - team-chat

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: team-chat-reverb
    command: php artisan reverb:start --host=0.0.0.0
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8080:8080"
    depends_on:
      - app
    networks:
      - team-chat

networks:
  team-chat:
    driver: bridge

volumes:
  mysql-data: